name: YLW public catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions: {}
concurrency:
  group: ylw-public-catalog
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.YLW_ENABLE_PUBLIC_SYNC == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare last known catalog
        run: node catalog-tools.mjs prepare
      - name: Read public website collections
        run: node sync-content.mjs --apply
      - name: Validate and prepare public JSON
        run: node catalog-tools.mjs publish
      - name: Save verified baseline for future imports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated public catalog'
            git push origin HEAD:main
          fi
      - name: Upload JSON-only Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish catalog to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
